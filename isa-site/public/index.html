<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ISA CONTROL V3</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <h1>ISA MISSION CONTROL</h1>
  <p class="sub">Live operational command system</p>
</header>

<!-- =========================
     AUTH
========================= -->
<section class="panel">
  <h2>Authentication</h2>

  <input id="email" type="email" placeholder="Operator email">
  <button onclick="login()">LOGIN</button>

  <p id="role">ROLE: ---</p>
</section>

<!-- =========================
     DASHBOARD
========================= -->
<section class="grid">

  <div class="card">
    <h3>Countdown</h3>
    <h2 id="countdown">---</h2>
  </div>

  <div class="card">
    <h3>Status</h3>
    <h2 id="status">---</h2>
  </div>

</section>

<!-- =========================
     NEWS
========================= -->
<section class="panel">
  <h2>Mission News</h2>

  <div id="news" class="news-box">NO ACTIVE NEWS</div>

  <img id="newsImage" class="news-image" style="display:none"/>

  <hr>

  <h3>News Controls (ADMIN)</h3>

  <input id="newsInput" placeholder="Enter mission update">

  <button class="btn primary" onclick="setNews()">UPDATE NEWS</button>
  <button class="btn danger" onclick="clearNews()">DELETE NEWS</button>

  <hr>

  <h3>Image Controls (ADMIN)</h3>

  <input type="file" id="imageInput">

  <button class="btn primary" onclick="uploadImage()">UPLOAD IMAGE</button>
  <button class="btn danger" onclick="clearImage()">DELETE IMAGE</button>
</section>

<!-- =========================
     LOGS
========================= -->
<section class="panel">
  <h2>System Logs</h2>
  <pre id="logs" class="logs"></pre>
</section>

<!-- =========================
     DIRECTOR PANEL
========================= -->
<section id="directorPanel" class="panel hidden">

  <h2>Director Controls</h2>

  <button class="btn primary" onclick="toggleLaunch()">TOGGLE LAUNCH</button>
  <button class="btn danger" onclick="abortMission()">ABORT MISSION</button>

  <hr>

  <h3>Countdown Control</h3>

  <div class="row">
    <input id="years" placeholder="Years">
    <input id="months" placeholder="Months">
    <input id="weeks" placeholder="Weeks">
    <input id="days" placeholder="Days">
    <input id="hours" placeholder="Hours">
    <input id="minutes" placeholder="Minutes">
    <input id="seconds" placeholder="Seconds">
  </div>

  <button class="btn primary" onclick="setCountdown()">SET COUNTDOWN</button>

  <button class="btn danger" onclick="stopCountdown()">STOP COUNTDOWN</button>
  <button class="btn primary" onclick="resumeCountdown()">RESUME COUNTDOWN</button>

</section>

<script src="app.js"></script>
</body>
</html>
